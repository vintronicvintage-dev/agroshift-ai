name: AgroShift QA
on:
  push:
    branches: [main, codex/qa-tests]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
